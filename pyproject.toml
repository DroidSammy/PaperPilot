[project]
name = "paperpilot"
version = "0.1.0"
description = "Intelligent Document Q&A Powered by Retrieval-Augmented Generation"
readme = "README.md"
authors = [
    { name = "sameer", email = "sameersingh0712@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.7",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.2.0",
    "langchain-openai>=1.7.3",
    "langchain-text-splitters>=1.1.3",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "spacy>=3.8.18",
    "streamlit>=1.67.0",
]

[project.scripts]
paperpilot = "paperpilot:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
